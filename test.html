<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mission Vision Boxes Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .speech-bubble {
      border-radius: 20px;
      position: relative;
      box-shadow: 0 8px 16px rgba(0,0,0,0.08);
      padding: 32px 36px 28px 36px;
      background: #fff;
    }
    .bubble-yellow {
      background: #fff;
      box-shadow: 8px 10px 0 0 #facd60;
    }
    .bubble-green {
      background: #fff;
      box-shadow: 8px 10px 0 0 #68c9af;
    }
    .flag-yellow {
      position: absolute;
      top: 20px;
      right: 30px;
      width: 22px;
      height: 22px;
      color: #facd60;
    }
    .flag-green {
      position: absolute;
      top: 20px;
      right: 30px;
      width: 22px;
      height: 22px;
      color: #68c9af;
    }
    .speech-bubble:after {
      content: '';
      position: absolute;
      left: 36px;
      bottom: -24px;
      width: 36px;
      height: 24px;
      background: inherit;
      clip-path: polygon(50% 100%, 0 0, 100% 0);
      z-index: 1;
      box-shadow: none;
    }
    .bubble-yellow:after {
      background: #facd60;
    }
    .bubble-green:after {
      background: #68c9af;
    }
    .icon-circle {
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }
    .icon-yellow {
      color: #facd60;
    }
    .icon-green {
      color: #68c9af;
    }
    .section-title {
      font-weight: bold;
      font-size: 1.6rem;
      margin-left: 12px;
      margin-bottom: 7px;
      display: inline-block;
    }
    .section-desc {
      color: #666;
      font-size: 0.97rem;
    }
    @media (max-width: 767.98px) {
      .speech-bubble {
        margin-bottom: 2rem;
      }
    }
  </style>
</head>
<body style="background: #F5F3EE;">
  <div class="container py-5">
    <div class="row justify-content-center g-4">
      <!-- Mission -->
      <div class="col-md-6">
        <div class="speech-bubble bubble-yellow position-relative">
          <svg class="flag-yellow" viewBox="0 0 24 24"><path fill="currentColor" d="M4 2v20h2V14h12l-1-4l1-4H6V2z"/></svg>
          <span class="icon-circle icon-yellow">
            <!-- Target SVG -->
            <svg width="32" height="32" fill="none" viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" stroke="#000" stroke-width="2"/><circle cx="16" cy="16" r="6" stroke="#000" stroke-width="2"/><circle cx="16" cy="16" r="3" fill="#facd60" stroke="#000" stroke-width="2"/><path d="M28 4l-4 4" stroke="#000" stroke-width="2" stroke-linecap="round"/><path d="M28 4v4h-4" stroke="#000" stroke-width="2" stroke-linecap="round"/></svg>
          </span>
          <span class="section-title">Mission</span>
          <div class="section-desc mt-1">Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed diam nonummy nibh euismod tincidunt ut laoreet</div>
        </div>
      </div>
      <!-- Vision -->
      <div class="col-md-6">
        <div class="speech-bubble bubble-green position-relative">
          <svg class="flag-green" viewBox="0 0 24 24"><path fill="currentColor" d="M4 2v20h2V14h12l-1-4l1-4H6V2z"/></svg>
          <span class="icon-circle icon-green">
            <!-- Bulb SVG -->
            <svg width="32" height="32" fill="none" viewBox="0 0 32 32"><circle cx="16" cy="15" r="8" stroke="#68c9af" stroke-width="2"/><circle cx="16" cy="15" r="4" fill="#68c9af" stroke="#000" stroke-width="2"/><path d="M16 23v2" stroke="#000" stroke-width="2" stroke-linecap="round"/><path d="M19 27H13" stroke="#000" stroke-width="2" stroke-linecap="round"/><path d="M14 29h4" stroke="#000" stroke-width="2" stroke-linecap="round"/></svg>
          </span>
          <span class="section-title">Vision</span>
          <div class="section-desc mt-1">Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed diam nonummy nibh euismod tincidunt ut laoreet</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
